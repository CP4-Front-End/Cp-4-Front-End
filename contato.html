<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Contato</title>
</head>

<body>
    <form class="needs-validation" novalidate="">
        <div class="row g-3">
            <div class="col-sm-6"> <label for="firstName" class="form-label">Seu Nome</label> <input type="text"
                    class="form-control" id="firstName" placeholder="" value="" required="">
                <div class="invalid-feedback">
                    Insira um nome válido
                </div>
            </div>
            <div class="col-sm-6"> <label for="lastName" class="form-label">Sobrenome</label> <input type="text"
                    class="form-control" id="lastName" placeholder="" value="" required="">
                <div class="invalid-feedback">
                    Insira um sobrenome válido
                </div>
            </div>
            <div class="col-12"> <label for="username" class="form-label">Nome de usuário</label>
                <div class="input-group has-validation"> <span class="input-group-text">@</span> <input type="text"
                        class="form-control" id="username" placeholder="Usuário" required="">
                    <div class="invalid-feedback">
                        É necessário usuário
                    </div>
                </div>
            </div>
            <div class="col-12"> <label for="email" class="form-label">Email <span
                        class="text-body-secondary">(Opcional)</span></label> <input type="email" class="form-control"
                    id="email" placeholder="voce@fiap.com.br">
                <div class="invalid-feedback">
                    Please enter a valid email address for shipping updates.
                </div>
            </div>
            <div class="col-12"> <label for="address" class="form-label">Endereço</label> <input type="text"
                    class="form-control" id="address" placeholder="Rua..." required="">
                <div class="invalid-feedback">
                    Please enter your shipping address.
                </div>
            </div>
            <div class="col-md-5"> <label for="country" class="form-label">País</label> <select class="form-select"
                    id="country" required="">
                    <option value="">Selecionar</option>
                    <option>United States</option>
                </select>
                <div class="invalid-feedback">
                    Selecione um país válido
                </div>
            </div>
            <div class="col-md-4"> <label for="state" class="form-label">Estado</label> <select class="form-select"
                    id="state" required="">
                    <option value="">Selecionar...</option>
                    <option>São Paulo</option>
                </select>
                <div class="invalid-feedback">
                    Selecione um estado válido
                </div>
            </div>
        </div>
        <hr class="my-4">
        <div class="form-check"> <input type="checkbox" class="form-check-input" id="save-info"> <label
                class="form-check-label" for="save-info">Salvar minhas informações para a próxima vez.</label> </div>
        <hr class="my-4">
        <h4 class="mb-3">Inserir algo</h4>
        <div class="my-3">
            <div class="form-check"> <input id="credit" name="paymentMethod" type="radio" class="form-check-input"
                    checked="" required=""> <label class="form-check-label" for="credit">Opção 1</label> </div>
            <div class="form-check"> <input id="debit" name="paymentMethod" type="radio" class="form-check-input"
                    required=""> <label class="form-check-label" for="debit">Opção 2</label> </div>
            <div class="form-check"> <input id="paypal" name="paymentMethod" type="radio" class="form-check-input"
                    required=""> <label class="form-check-label" for="paypal">Opção 3</label> </div>
        </div>
        
        <hr class="my-4"> <button class="w-100 btn btn-primary btn-lg" type="submit">Enviar</button>
    </form>
</body>

</html>
